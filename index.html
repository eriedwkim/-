<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도르래 힘·줄 길이 시뮬레이션</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .description {
      color: #5c6678;
      margin-bottom: 20px;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select,
    input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    input[type="range"] {
      width: 100%;
    }

    .range-value {
      text-align: right;
      font-weight: bold;
      margin-top: 3px;
    }

    .hint {
      font-size: 13px;
      color: #68758a;
      line-height: 1.5;
      margin-top: 6px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #pullButton {
      background: #2563eb;
      color: white;
    }

    #resetButton {
      background: #e2e8f0;
      color: #172033;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .result {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 13px;
    }

    .result-title {
      color: #667085;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .result-value {
      font-size: 21px;
      font-weight: bold;
    }

    .unit {
      font-size: 12px;
      color: #667085;
    }

    canvas {
      width: 100%;
      height: 500px;
      background: linear-gradient(#fbfdff, #eef4fb);
      border: 1px solid #dce3ee;
      border-radius: 12px;
    }

    .formula {
      margin-top: 15px;
      background: #f7f9fc;
      border-left: 4px solid #2563eb;
      padding: 12px;
      line-height: 1.6;
      font-size: 14px;
    }

    .status {
      margin-top: 10px;
      background: #eef5ff;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      color: #34527d;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .result-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>도르래 힘·줄 길이 시뮬레이션</h1>

  <p class="description">
    도르래의 종류에 따라 100 kg의 물체를 들어 올리는 데 필요한 힘과 당겨야 하는 줄의 길이를 비교합니다.
  </p>

  <div class="layout">

    <!-- 왼쪽 설정창 -->
    <div class="card">

      <h2>설정</h2>

      <label for="pulleyType">도르래 종류</label>

      <select id="pulleyType">
        <option value="fixed">고정 도르래 (1:1)</option>
        <option value="movable">움직 도르래 (2:1)</option>
        <option value="compound2">복합 도르래 (2:1)</option>
        <option value="compound4" selected>복합 도르래 (4:1)</option>
        <option value="compound6">복합 도르래 (6:1)</option>
        <option value="compound8">복합 도르래 (8:1)</option>
        <option value="custom">사용자 설정</option>
      </select>

      <div class="hint" id="typeHint"></div>


      <label for="mass">물체 질량 (kg)</label>
      <input
        type="number"
        id="mass"
        min="1"
        max="1000"
        value="100"
      >


      <label for="gravity">중력가속도 (m/s²)</label>
      <input
        type="number"
        id="gravity"
        min="1"
        max="20"
        step="0.01"
        value="9.81"
      >


      <label for="efficiency">도르래 효율 (%)</label>

      <input
        type="range"
        id="efficiency"
        min="30"
        max="100"
        value="100"
      >

      <div class="range-value">
        <span id="efficiencyValue">100</span>%
      </div>


      <div id="customArea" style="display:none">

        <label for="customMA">
          기계적 이점
        </label>

        <input
          type="number"
          id="customMA"
          min="1"
          max="20"
          value="4"
        >

      </div>


      <label for="liftHeight">
        올릴 높이 (m)
      </label>

      <input
        type="number"
        id="liftHeight"
        min="0.1"
        max="20"
        step="0.1"
        value="1"
      >


      <label for="pullSpeed">
        줄 당기는 속도 (m/s)
      </label>

      <input
        type="range"
        id="pullSpeed"
        min="0.1"
        max="2"
        step="0.1"
        value="0.7"
      >

      <div class="range-value">
        <span id="speedValue">0.7</span> m/s
      </div>


      <div class="buttons">

        <button id="pullButton">
          줄 당기기
        </button>

        <button id="resetButton">
          초기화
        </button>

      </div>


      <div class="formula" id="formula"></div>

    </div>


    <!-- 오른쪽 시뮬레이션 -->
    <div class="card">

      <div class="result-grid">

        <div class="result">

          <div class="result-title">
            기계적 이점
          </div>

          <div class="result-value">
            <span id="ma">4.0</span>
          </div>

          <div class="unit">
            배
          </div>

        </div>


        <div class="result">

          <div class="result-title">
            필요한 힘
          </div>

          <div class="result-value">
            <span id="force">245.3</span>
          </div>

          <div class="unit">
            N
          </div>

        </div>


        <div class="result">

          <div class="result-title">
            필요한 줄 길이
          </div>

          <div class="result-value">
            <span id="ropeLength">4.00</span>
          </div>

          <div class="unit">
            m
          </div>

        </div>


        <div class="result">

          <div class="result-title">
            현재 상승 높이
          </div>

          <div class="result-value">
            <span id="currentHeight">0.00</span>
          </div>

          <div class="unit">
            m
          </div>

        </div>

      </div>


      <canvas
        id="simulation"
        width="850"
        height="500">
      </canvas>


      <div class="status" id="status">
        "줄 당기기" 버튼을 누르고 있으면 하중이 올라갑니다.
      </div>

    </div>

  </div>

</div>


<script>

const canvas = document.getElementById("simulation");
const ctx = canvas.getContext("2d");

const pulleyType = document.getElementById("pulleyType");
const massInput = document.getElementById("mass");
const gravityInput = document.getElementById("gravity");
const efficiencyInput = document.getElementById("efficiency");
const customMAInput = document.getElementById("customMA");
const liftHeightInput = document.getElementById("liftHeight");
const pullSpeedInput = document.getElementById("pullSpeed");

const maOutput = document.getElementById("ma");
const forceOutput = document.getElementById("force");
const ropeLengthOutput = document.getElementById("ropeLength");
const currentHeightOutput = document.getElementById("currentHeight");

const efficiencyValue = document.getElementById("efficiencyValue");
const speedValue = document.getElementById("speedValue");

const formula = document.getElementById("formula");
const status = document.getElementById("status");

const customArea = document.getElementById("customArea");
const typeHint = document.getElementById("typeHint");

const pullButton = document.getElementById("pullButton");
const resetButton = document.getElementById("resetButton");


let currentHeight = 0;
let pulling = false;

let lastTime = performance.now();


/*
도르래별 기계적 이점
*/

const pulleyData = {

  fixed: {
    ma: 1,
    mode: "fixed",
    text:
      "힘의 방향을 바꾸는 역할을 하며 이상적인 경우 필요한 힘은 줄어들지 않습니다."
  },

  movable: {
    ma: 2,
    mode: "movable",
    text:
      "하중을 두 가닥의 줄이 지지하기 때문에 필요한 힘이 절반으로 감소합니다."
  },

  compound2: {
    ma: 2,
    mode: "compound",
    text:
      "2:1 복합 도르래입니다."
  },

  compound4: {
    ma: 4,
    mode: "compound",
    text:
      "4:1 복합 도르래입니다. 필요한 힘은 이상적인 조건에서 1/4로 감소합니다."
  },

  compound6: {
    ma: 6,
    mode: "compound",
    text:
      "6:1 복합 도르래입니다."
  },

  compound8: {
    ma: 8,
    mode: "compound",
    text:
      "8:1 복합 도르래입니다."
  }

};


/*
현재 기계적 이점 계산
*/

function getMechanicalAdvantage() {

  if (pulleyType.value === "custom") {

    return Math.max(
      1,
      Number(customMAInput.value) || 1
    );

  }

  return pulleyData[pulleyType.value].ma;

}


/*
현재 도르래 모드
*/

function getMode() {

  if (pulleyType.value === "custom") {
    return "compound";
  }

  return pulleyData[pulleyType.value].mode;

}


/*
계산 및 화면 업데이트
*/

function updateCalculations() {

  const mass =
    Math.max(
      0.1,
      Number(massInput.value) || 100
    );

  const g =
    Math.max(
      0.1,
      Number(gravityInput.value) || 9.81
    );

  const efficiency =
    Math.max(
      0.01,
      Number(efficiencyInput.value) / 100
    );

  const height =
    Math.max(
      0.1,
      Number(liftHeightInput.value) || 1
    );

  const ma =
    getMechanicalAdvantage();


  /*
  무게
  */

  const weight =
    mass * g;


  /*
  이상적인 필요 힘

  F = W / MA
  */

  const idealForce =
    weight / ma;


  /*
  실제 필요 힘

  효율이 100%보다 낮으면
  더 큰 힘이 필요
  */

  const realForce =
    idealForce / efficiency;


  /*
  줄 길이

  이동거리 = 하중 이동거리 × 기계적 이점
  */

  const ropeLength =
    height * ma;


  maOutput.textContent =
    ma.toFixed(1);

  forceOutput.textContent =
    realForce.toFixed(1);

  ropeLengthOutput.textContent =
    ropeLength.toFixed(2);

  currentHeightOutput.textContent =
    currentHeight.toFixed(2);


  efficiencyValue.textContent =
    Math.round(efficiency * 100);

  speedValue.textContent =
    Number(pullSpeedInput.value).toFixed(1);


  /*
  설명
  */

  if (pulleyType.value === "custom") {

    typeHint.textContent =
      "사용자가 기계적 이점을 직접 설정합니다.";

  } else {

    typeHint.textContent =
      pulleyData[pulleyType.value].text;

  }


  /*
  계산식 표시
  */

  formula.innerHTML = `

    <b>계산식</b><br><br>

    물체의 무게 =
    질량 × 중력가속도<br>

    = ${mass.toFixed(1)}
    × ${g.toFixed(2)}
    =
    <b>${weight.toFixed(1)} N</b>

    <br><br>

    이상적인 필요 힘 =
    물체의 무게 ÷ 기계적 이점

    <br>

    = ${weight.toFixed(1)}
    ÷ ${ma.toFixed(1)}

    =
    <b>${idealForce.toFixed(1)} N</b>

    <br><br>

    실제 필요 힘 =
    이상적인 힘 ÷ 효율

    <br>

    =
    <b>${realForce.toFixed(1)} N</b>

    <br><br>

    필요한 줄 길이 =
    올리는 높이 × 기계적 이점

    <br>

    =
    ${height.toFixed(2)}
    × ${ma.toFixed(1)}

    =
    <b>${ropeLength.toFixed(2)} m</b>

  `;


  drawSimulation();

}


/*
둥근 사각형
*/

function roundedRect(
  x,
  y,
  width,
  height,
  radius
) {

  ctx.beginPath();

  ctx.roundRect(
    x,
    y,
    width,
    height,
    radius
  );

  ctx.fill();

  ctx.stroke();

}


/*
도르래 그리기
*/

function drawPulley(
  x,
  y,
  radius,
  label
) {

  ctx.save();

  ctx.fillStyle = "#e2e8f0";

  ctx.strokeStyle = "#334155";

  ctx.lineWidth = 5;


  ctx.beginPath();

  ctx.arc(
    x,
    y,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.stroke();


  ctx.strokeStyle = "#64748b";

  ctx.lineWidth = 3;


  ctx.beginPath();

  ctx.arc(
    x,
    y,
    radius * 0.45,
    0,
    Math.PI * 2
  );

  ctx.stroke();


  ctx.fillStyle = "#334155";

  ctx.font = "bold 13px Arial";

  ctx.textAlign = "center";

  ctx.fillText(
    label,
    x,
    y + radius + 20
  );


  ctx.restore();

}


/*
화살표
*/

function drawArrow(
  x1,
  y1,
  x2,
  y2,
  color
) {

  const angle =
    Math.atan2(
      y2 - y1,
      x2 - x1
    );

  const size = 10;


  ctx.strokeStyle =
    color;

  ctx.fillStyle =
    color;

  ctx.lineWidth = 3;


  ctx.beginPath();

  ctx.moveTo(
    x1,
    y1
  );

  ctx.lineTo(
    x2,
    y2
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    x2,
    y2
  );

  ctx.lineTo(
    x2 -
    size *
    Math.cos(angle - Math.PI / 6),

    y2 -
    size *
    Math.sin(angle - Math.PI / 6)
  );

  ctx.lineTo(
    x2 -
    size *
    Math.cos(angle + Math.PI / 6),

    y2 -
    size *
    Math.sin(angle + Math.PI / 6)
  );

  ctx.closePath();

  ctx.fill();

}


/*
100 kg 하중 그리기
*/

function drawLoad(
  x,
  y
) {

  ctx.fillStyle =
    "#4f83e1";

  ctx.strokeStyle =
    "#274c87";

  ctx.lineWidth = 2;


  roundedRect(
    x - 60,
    y,
    120,
    55,
    10
  );


  ctx.fillStyle =
    "white";

  ctx.font =
    "bold 14px Arial";

  ctx.textAlign =
    "center";

  ctx.fillText(
    "100 kg 하중",
    x,
    y + 33
  );

}


/*
바닥선
*/

function drawGround() {

  ctx.strokeStyle =
    "#94a3b8";

  ctx.lineWidth =
    2;

  ctx.setLineDash(
    [5, 5]
  );


  ctx.beginPath();

  ctx.moveTo(
    20,
    430
  );

  ctx.lineTo(
    canvas.width - 20,
    430
  );

  ctx.stroke();


  ctx.setLineDash([]);

}


/*
고정 도르래
*/

function drawFixedPulley() {

  const centerX = 300;

  const pulleyY = 140;

  const radius = 50;


  const targetHeight =
    Number(liftHeightInput.value) || 1;


  const movement =
    currentHeight /
    targetHeight;


  const loadY =
    300 -
    movement * 160;


  /*
  천장
  */

  ctx.fillStyle =
    "#94a3b8";

  ctx.fillRect(
    centerX - 100,
    55,
    200,
    15
  );


  drawPulley(
    centerX,
    pulleyY,
    radius,
    "고정 도르래"
  );


  /*
  줄
  */

  ctx.strokeStyle =
    "#d28a2d";

  ctx.lineWidth =
    5;


  ctx.beginPath();

  ctx.moveTo(
    centerX,
    70
  );

  ctx.lineTo(
    centerX,
    pulleyY - radius
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    centerX - radius,
    pulleyY
  );

  ctx.lineTo(
    centerX - radius,
    loadY
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    centerX + radius,
    pulleyY
  );

  ctx.lineTo(
    centerX + radius,
    350
  );

  ctx.stroke();


  /*
  하중
  */

  drawLoad(
    centerX - radius,
    loadY
  );


  /*
  당기는 방향
  */

  drawArrow(
    centerX + radius,
    330,
    centerX + radius,
    405,
    "#d94c4c"
  );


  ctx.fillStyle =
    "#d94c4c";

  ctx.font =
    "bold 13px Arial";

  ctx.textAlign =
    "left";

  ctx.fillText(
    "당기는 방향",
    centerX + radius + 12,
    400
  );


  drawGround();

}


/*
움직 도르래
*/

function drawMovablePulley() {

  const centerX = 300;

  const fixedY = 90;

  const radius = 45;


  const targetHeight =
    Number(liftHeightInput.value) || 1;


  const movement =
    currentHeight /
    targetHeight;


  const movableY =
    250 -
    movement * 130;


  /*
  천장
  */

  ctx.fillStyle =
    "#94a3b8";

  ctx.fillRect(
    centerX - 130,
    45,
    260,
    15
  );


  /*
  고정 도르래
  */

  drawPulley(
    centerX,
    fixedY,
    radius,
    "고정"
  );


  /*
  움직 도르래
  */

  drawPulley(
    centerX,
    movableY,
    radius,
    "움직"
  );


  /*
  줄
  */

  ctx.strokeStyle =
    "#d28a2d";

  ctx.lineWidth =
    5;


  ctx.beginPath();

  ctx.moveTo(
    centerX - 130,
    45
  );

  ctx.lineTo(
    centerX - radius,
    movableY
  );

  ctx.lineTo(
    centerX + radius,
    movableY
  );

  ctx.lineTo(
    centerX + radius,
    fixedY
  );

  ctx.lineTo(
    centerX + radius + 80,
    fixedY
  );

  ctx.stroke();


  /*
  하중
  */

  drawLoad(
    centerX,
    movableY + 35
  );


  /*
  당기는 방향
  */

  drawArrow(
    centerX + radius + 80,
    110,
    centerX + radius + 80,
    175,
    "#d94c4c"
  );


  ctx.fillStyle =
    "#d94c4c";

  ctx.font =
    "bold 13px Arial";

  ctx.fillText(
    "당기는 방향",
    centerX + radius + 90,
    170
  );


  drawGround();

}


/*
복합 도르래
*/

function drawCompoundPulley() {

  const ma =
    Math.round(
      getMechanicalAdvantage()
    );


  const targetHeight =
    Number(liftHeightInput.value) || 1;


  const movement =
    currentHeight /
    targetHeight;


  const lowerY =
    280 -
    movement * 140;


  const centerX = 300;


  /*
  천장
  */

  ctx.fillStyle =
    "#94a3b8";

  ctx.fillRect(
    centerX - 150,
    45,
    300,
    15
  );


  /*
  위쪽 도르래
  */

  drawPulley(
    centerX - 45,
    105,
    35,
    "고정"
  );


  drawPulley(
    centerX + 45,
    105,
    35,
    "고정"
  );


  /*
  줄 여러 가닥
  */

  const ropeCount =
    Math.min(
      ma,
      8
    );


  for (
    let i = 0;
    i < ropeCount;
    i++
  ) {

    const x =
      centerX -
      90 +
      i *
      (180 /
      Math.max(
        1,
        ropeCount - 1
      ));


    ctx.strokeStyle =
      "#d28a2d";

    ctx.lineWidth =
      4;


    ctx.beginPath();

    ctx.moveTo(
      x,
      55
    );

    ctx.lineTo(
      x,
      lowerY
    );

    ctx.stroke();

  }


  /*
  아래쪽 블록
  */

  ctx.fillStyle =
    "#cbd5e1";

  ctx.strokeStyle =
    "#475569";

  ctx.lineWidth =
    3;


  roundedRect(
    centerX - 120,
    lowerY + 10,
    240,
    80,
    12
  );


  ctx.fillStyle =
    "#334155";

  ctx.font =
    "bold 15px Arial";

  ctx.textAlign =
    "center";


  ctx.fillText(
    `복합 도르래 ${ma}:1`,
    centerX,
    lowerY + 40
  );


  ctx.fillText(
    "100 kg 하중",
    centerX,
    lowerY + 67
  );


  /*
  자유단
  */

  const freeX =
    centerX + 160;


  ctx.strokeStyle =
    "#d28a2d";

  ctx.lineWidth =
    5;


  ctx.beginPath();

  ctx.moveTo(
    freeX,
    80
  );

  ctx.lineTo(
    freeX,
    365
  );

  ctx.stroke();


  /*
  당기는 방향
  */

  drawArrow(
    freeX,
    310,
    freeX,
    400,
    "#d94c4c"
  );


  ctx.fillStyle =
    "#d94c4c";

  ctx.font =
    "bold 13px Arial";


  ctx.fillText(
    "당기는 방향",
    freeX + 10,
    395
  );


  drawGround();

}


/*
시뮬레이션 화면 그리기
*/

function drawSimulation() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.fillStyle =
    "#172033";

  ctx.font =
    "bold 18px Arial";

  ctx.textAlign =
    "left";


  let title;


  if (
    pulleyType.value === "fixed"
  ) {

    title =
      "고정 도르래";

  } else if (
    pulleyType.value === "movable"
  ) {

    title =
      "움직 도르래";

  } else {

    title =
      `복합 도르래 ${getMechanicalAdvantage()}:1`;

  }


  ctx.fillText(
    title,
    25,
    30
  );


  const mode =
    getMode();


  if (mode === "fixed") {

    drawFixedPulley();

  }

  else if (
    mode === "movable"
  ) {

    drawMovablePulley();

  }

  else {

    drawCompoundPulley();

  }

}


/*
줄 당기기 시작
*/

function startPull(event) {

  event.preventDefault();

  pulling = true;

  status.textContent =
    "줄을 당기는 중입니다. 하중이 올라가고 있습니다.";

}


/*
줄 당기기 중지
*/

function stopPull() {

  pulling = false;


  const target =
    Number(liftHeightInput.value) || 1;


  if (
    currentHeight >= target
  ) {

    status.textContent =
      "설정한 높이까지 들어 올렸습니다.";

  }

  else {

    status.textContent =
      "줄 당기기를 멈췄습니다.";

  }

}


/*
초기화
*/

function resetSimulation() {

  pulling = false;

  currentHeight = 0;

  status.textContent =
    "\"줄 당기기\" 버튼을 누르고 있으면 하중이 올라갑니다.";

  updateCalculations();

}


/*
마우스 / 터치 이벤트
*/

pullButton.addEventListener(
  "pointerdown",
  startPull
);


window.addEventListener(
  "pointerup",
  stopPull
);


/*
설정 변경
*/

pulleyType.addEventListener(
  "input",
  () => {

    const custom =
      pulleyType.value === "custom";


    customArea.style.display =
      custom
      ? "block"
      : "none";


    updateCalculations();

  }
);


massInput.addEventListener(
  "input",
  updateCalculations
);


gravityInput.addEventListener(
  "input",
  updateCalculations
);


efficiencyInput.addEventListener(
  "input",
  updateCalculations
);


customMAInput.addEventListener(
  "input",
  updateCalculations
);


liftHeightInput.addEventListener(
  "input",
  updateCalculations
);


pullSpeedInput.addEventListener(
  "input",
  updateCalculations
);


resetButton.addEventListener(
  "click",
  resetSimulation
);


/*
애니메이션
*/

function animate(currentTime) {

  const deltaTime =
    Math.min(
      0.05,
      (currentTime - lastTime) / 1000
    );


  lastTime =
    currentTime;


  if (pulling) {

    const target =
      Number(liftHeightInput.value) || 1;


    const speed =
      Number(pullSpeedInput.value) || 0.7;


    const ma =
      getMechanicalAdvantage();


    /*
    줄 이동속도 / 기계적 이점
    =
    하중 상승속도
    */

    currentHeight +=
      (speed / ma) *
      deltaTime;


    if (
      currentHeight >= target
    ) {

      currentHeight =
        target;

      pulling = false;

      status.textContent =
        "설정한 높이까지 들어 올렸습니다.";

    }


    currentHeightOutput.textContent =
      currentHeight.toFixed(2);


    drawSimulation();

  }


  requestAnimationFrame(
    animate
  );

}


/*
초기 실행
*/

updateCalculations();

requestAnimationFrame(
  animate
);

</script>

</body>
</html>
